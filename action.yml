name: code-bloat-review
description: "Is this code disproportionately large for what it does? Clean Code as the yardstick."
branding:
  icon: scissors
  color: orange

inputs:
  path:
    description: Project directory to review
    default: "."
  fail-above:
    description: Fail the step when the score (0-100) is above this value; empty = never fail
    default: ""
  args:
    description: Extra CLI arguments, e.g. "--exclude 'legacy/*' --mode library"
    default: ""

outputs:
  score:
    description: Bloat score, 0-100 (higher = more bloat)
    value: ${{ steps.review.outputs.score }}
  answer:
    description: YES / PARTLY / NO
    value: ${{ steps.review.outputs.answer }}
  report:
    description: Path to the Markdown report (handy for PR comments)
    value: ${{ steps.review.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - id: review
      shell: bash
      # Inputs go through env, never straight into the script (no injection via inputs).
      env:
        REVIEW_PATH: ${{ inputs.path }}
        FAIL_ABOVE: ${{ inputs.fail-above }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        python - <<'PYTHON'
        import json
        import os
        import shlex
        import subprocess
        from pathlib import Path

        try:
            extra_args = shlex.split(os.environ["EXTRA_ARGS"])
        except ValueError as error:
            raise SystemExit(f"Invalid args input: {error}") from error

        runner_temp = Path(os.environ["RUNNER_TEMP"])
        json_report = runner_temp / "code-bloat-review.json"
        report = runner_temp / "code-bloat-review.md"
        command = ["code-bloat-review", os.environ["REVIEW_PATH"]]
        subprocess.run([*command, "-f", "json", "-o", str(json_report), *extra_args])

        threshold = os.environ["FAIL_ABOVE"]
        gate_args = ["--fail-above", threshold] if threshold else []
        result = subprocess.run(
            [*command, "-f", "markdown", "-o", str(report), *extra_args, *gate_args]
        )

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write(report.read_text(encoding="utf-8"))
        data = json.loads(json_report.read_text(encoding="utf-8"))
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
            print(f"score={data['score']}", file=outputs)
            print(f"answer={data['answer']}", file=outputs)
            print(f"report={report}", file=outputs)
        raise SystemExit(result.returncode)
        PYTHON
