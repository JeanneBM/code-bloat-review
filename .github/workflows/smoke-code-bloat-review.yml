name: Smoke test code-bloat-review

# Runs the published action exactly as users get it (@v1): after each release, on demand,
# and weekly to catch runner image changes. CI tests the code in this repo with `uses: ./`.
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Create sample project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bloat-smoke/legacy dir"
          printf 'print("keep")\n' > "$RUNNER_TEMP/bloat-smoke/app.py"
          printf 'print("exclude")\n' > "$RUNNER_TEMP/bloat-smoke/legacy dir/old.py"

      - name: Run published repository action
        id: review
        uses: JeanneBM/code-bloat-review@v1
        with:
          path: ${{ runner.temp }}/bloat-smoke
          args: "--exclude 'legacy dir/*'"

      - name: Verify report and outputs
        shell: bash
        env:
          REPORT: ${{ steps.review.outputs.report }}
          SCORE: ${{ steps.review.outputs.score }}
          ANSWER: ${{ steps.review.outputs.answer }}
        run: |
          test -s "$REPORT"
          test -n "$SCORE"
          test "$ANSWER" = "NO"
          grep -F '1 SLOC in 1 production file' "$REPORT"
