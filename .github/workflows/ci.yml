name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # The tool reviews its own code with its own action; the threshold lives in pyproject.toml.
  self-review:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: review
        uses: ./
      - run: echo "Self-review answer ${{ steps.review.outputs.answer }}, score ${{ steps.review.outputs.score }}"

  # The action as users run it, on every runner OS: gate, outputs, exclude/args quoting,
  # two uses in one job, and the job's own Python left alone.
  action:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Sample project with a space in a directory name
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke/legacy dir"
          printf 'print("keep")\n' > "$RUNNER_TEMP/smoke/app.py"
          printf 'print("exclude")\n' > "$RUNNER_TEMP/smoke/legacy dir/old.py"
      - id: bloated
        uses: ./
        continue-on-error: true
        with:
          path: examples/bloated_todo
          fail-above: "45"
      - id: excluded
        uses: ./
        with:
          path: examples/bloated_todo
          exclude: |
            todo_app/*
          mode: app
      - id: quoted
        uses: ./
        with:
          path: ${{ runner.temp }}/smoke
          args: --exclude 'legacy dir/*' --top 3
      - shell: bash
        env:
          OUTCOME: ${{ steps.bloated.outcome }}
          ANSWER: ${{ steps.bloated.outputs.answer }}
          REPORT: ${{ steps.bloated.outputs.report }}
          JSON: ${{ steps.bloated.outputs.json }}
          EXCLUDED: ${{ steps.excluded.outputs.score }}
          QUOTED: ${{ steps.quoted.outputs.report }}
        run: |
          set -x
          test "$OUTCOME" = failure
          test "$ANSWER" = YES
          grep -q '## code-bloat-review: \*\*YES\*\*' "$REPORT"
          grep -q '"answer": "YES"' "$JSON"
          test "$EXCLUDED" = 0.0
          grep -qF '1 SLOC in 1 production file' "$QUOTED"
          python -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
